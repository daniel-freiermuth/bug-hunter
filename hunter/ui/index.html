<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hunter</title>
<style>
  :root {
    --bg: #101214; --panel: #16191c; --panel2: #1b1f23; --line: #262b30;
    --fg: #c8cdd2; --dim: #7a838c; --faint: #4d555d;
    --green: #4cbf6b; --red: #e05252; --amber: #d9a441; --blue: #5aa0e0;
    --purple: #a07ae0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.45 "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 60px; }
  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--dim); margin: 26px 0 8px; font-weight: 600;
  }
  h2 .n { color: var(--faint); }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 3px; font: inherit; font-size: 12px; padding: 3px 10px;
    cursor: pointer;
  }
  button:hover { border-color: var(--dim); }
  button:disabled { opacity: .5; cursor: default; }

  /* ops strip */
  #ops {
    display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 10px 12px; margin-top: 12px;
  }
  #windows { display: flex; gap: 18px; flex-wrap: wrap; flex: 1; }
  .win { min-width: 190px; }
  .win .lab { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); }
  .win .lab b { color: var(--fg); font-weight: 600; }
  .bar { height: 6px; background: #0b0d0e; border-radius: 3px; margin: 4px 0 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; }
  .win .sub { font-size: 11px; color: var(--faint); }
  .ok    { background: var(--green); }
  .bad   { background: var(--red); }
  .stale { background: var(--amber); }
  #opsRight { text-align: right; min-width: 220px; }
  #lastEvent { font-size: 11px; color: var(--dim); margin-top: 6px; max-width: 340px;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* finding cards */
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 8px 10px; margin-bottom: 8px;
  }
  .card .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .badge {
    font-size: 10px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line);
    text-transform: uppercase; letter-spacing: .05em;
  }
  .sev-high, .sev-critical { color: var(--red); border-color: var(--red); }
  .sev-medium { color: var(--amber); border-color: var(--amber); }
  .sev-low { color: var(--dim); }
  .fp { font-size: 10px; color: var(--faint); }
  .card .sum { font-weight: 600; margin: 4px 0; }
  .card .loc { font-size: 11px; color: var(--dim); }
  .card details { margin: 6px 0 2px; }
  .card details summary { cursor: pointer; color: var(--dim); font-size: 11px; }
  .card pre {
    white-space: pre-wrap; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 3px; padding: 6px 8px; font-size: 11.5px; margin: 6px 0; color: var(--fg);
  }
  .acts { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .acts .q { border-color: var(--green); color: var(--green); }
  .acts .r { border-color: var(--red); color: var(--red); }
  .acts .rc { border-color: var(--purple); color: var(--purple); background: transparent; }

  /* pipeline */
  #pipeline { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
  .col h3 { margin: 0 0 6px; font-size: 10px; text-transform: uppercase;
            letter-spacing: .1em; color: var(--dim); font-weight: 600; }
  .col .item { border-top: 1px solid var(--line); padding: 5px 0; font-size: 12px; }
  .col .item:first-of-type { border-top: none; }
  .col .item .m { color: var(--faint); font-size: 10.5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .uq { font-size: 10px; padding: 1px 6px; border-color: var(--amber); color: var(--amber); background: transparent; }
  .ov { font-size: 9px; padding: 1px 5px; border-radius: 3px; background: var(--amber); color: #000; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .ov-btn { font-size: 10px; padding: 1px 6px; border-color: var(--blue); color: var(--blue); background: transparent; }

  /* tables / feeds */
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.num { text-align: right; }
  .state-running { color: var(--blue); }
  .state-done { color: var(--green); }
  .state-killed, .state-failed { color: var(--red); }

  #events { background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
            padding: 8px 10px; font-size: 11.5px; }
  #events .ev { padding: 2px 0; color: var(--dim); }
  #events .ev .t { color: var(--faint); }
  #events .ev .k { color: var(--purple); }
  .empty { color: var(--faint); font-size: 12px; padding: 4px 0; }
  #err { color: var(--red); font-size: 11px; margin-top: 6px; display: none; }
  .timeline { font-size: 11px; border-left: 2px solid var(--line); margin: 6px 0 2px 4px; padding-left: 10px; }
  .tl-entry { padding: 2px 0; color: var(--dim); }
  .tl-entry .t { color: var(--faint); margin-right: 4px; }
  .tl-entry .k { color: var(--purple); font-weight: 600; margin-right: 2px; }

  /* filter bar */
  #filters {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin-bottom: 10px; font-size: 12px;
  }
  #filters select, #filters input[type=range] {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 3px; font: inherit; font-size: 12px; padding: 2px 6px;
  }
  #filters label { color: var(--dim); font-size: 11px; }
  #filters .sep { border-left: 1px solid var(--line); height: 20px; }
</style>
</head>
<body>
<main>
  <div id="ops">
    <div id="windows"><span class="empty">no window data</span></div>
    <div id="opsRight">
      <button id="runCycle">Run Cycle</button>
      <div id="lastEvent">&nbsp;</div>
    </div>
  </div>
  <div id="err"></div>

  <h2>Inbox <span class="n" id="nInbox"></span></h2>
  <div id="filters">
    <label>repo</label><select id="fRepo"><option value="">all</option></select>
    <div class="sep"></div>
    <label>class</label><select id="fClass"><option value="">all</option></select>
    <div class="sep"></div>
    <label>min severity</label><select id="fSev"><option value="">all</option>
      <option>high</option><option>medium</option><option>low</option></select>
    <div class="sep"></div>
    <label>min confidence</label>
    <input type="range" id="fConf" min="0" max="100" value="0" step="5">
    <span id="fConfVal">0%</span>
    <div class="sep"></div>
    <label>sort</label><select id="fSort">
      <option value="score">severity × confidence</option>
      <option value="newest">newest first</option>
      <option value="oldest">oldest first</option>
      <option value="repo">by repo</option>
    </select>
  </div>
  <div id="inbox"></div>

  <h2>Pipeline <button class="ov-btn" onclick="clearAllOverrides()" style="font-size:10px;vertical-align:middle">Clear all overrides</button></h2>
  <div id="pipeline"></div>

  <h2>Suppressed <span class="n" id="nSupp"></span></h2>
  <details><summary>rejected / wontfix</summary><div id="suppressed"></div></details>

  <h2>Notes <span class="n" id="nNotes"></span></h2>
  <details><summary>informational findings</summary><div id="notes"></div></details>

  <h2>Stats</h2>
  <details><summary>token usage and job metrics</summary><div id="stats"></div></details>

  <h2>Jobs</h2>
  <div id="jobs"></div>

  <h2>Events</h2>
  <div id="events"></div>
</main>

<script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hunter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='18' cy='18' r='11' stroke='%235aa0e0' stroke-width='2.2' fill='none'/><line x1='26' y1='26' x2='36' y2='36' stroke='%235aa0e0' stroke-width='2.5' stroke-linecap='round'/><ellipse cx='18' cy='19' rx='5' ry='6.5' fill='%234cbf6b'/><circle cx='18' cy='11.5' r='2.8' fill='%234cbf6b'/></svg>">
<style>
  /* ── Design tokens ─────────────────────────────────────────────── */
  :root {
    /* Surfaces */
    --bg:     #101214;
    --panel:  #16191c;
    --panel2: #1b1f23;
    --line:   #262b30;
    /* Text */
    --fg:     #c8cdd2;
    --dim:    #7a838c;
    --faint:  #4d555d;
    /* Accents */
    --green:  #4cbf6b;
    --red:    #e05252;
    --amber:  #d9a441;
    --blue:   #5aa0e0;
    --purple: #a07ae0;
    /* Spacing scale (4px base) */
    --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;  --sp-4: 16px;
    --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;  --sp-12: 48px;
    /* Type scale */
    --text-2xs: 9px;  --text-xs: 10px; --text-sm: 11px;
    --text-base: 12px; --text-md: 13px; --text-lg: 15px;
    /* Radii */
    --radius-sm: 3px; --radius-md: 4px; --radius-lg: 6px;
    /* Shadows */
    --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,.4);
    /* Transitions */
    --ease: .15s ease-out;
  }

  /* ── Reset ──────────────────────────────────────────────────────── */
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: var(--text-md)/1.45 "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  /* ── Layout ─────────────────────────────────────────────────────── */
  .app { display: flex; align-items: flex-start; }
  #nav {
    flex: 0 0 170px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    background: var(--panel); border-right: 1px solid var(--line);
    padding: var(--sp-4) 0;
  }
  .nav-logo {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: var(--sp-1) var(--sp-5) var(--sp-4);
    border-bottom: 1px solid var(--line); margin-bottom: var(--sp-2);
  }
  .nav-logo span {
    font-size: var(--text-lg); font-weight: 700; letter-spacing: .04em;
    color: var(--fg); text-transform: lowercase;
  }
  #nav .nav-item {
    display: block; width: 100%; text-align: left; background: none; border: none;
    font: inherit; padding: var(--sp-2) var(--sp-6); font-size: var(--text-sm);
    text-transform: uppercase; letter-spacing: .1em;
    color: var(--dim); cursor: pointer; border-left: 2px solid transparent;
    transition: color var(--ease);
  }
  #nav .nav-item:hover { color: var(--fg); }
  #nav .nav-item.active {
    color: var(--fg); border-left-color: var(--blue); background: var(--panel2);
  }
  main { flex: 1; max-width: 1100px; padding: var(--sp-3) var(--sp-4) var(--sp-12); }
  .page { display: none; }
  .page.active { display: block; }

  /* ── Typography ─────────────────────────────────────────────────── */
  h2 {
    font-size: var(--text-sm); text-transform: uppercase; letter-spacing: .12em;
    color: var(--dim); margin: var(--sp-6) 0 var(--sp-2); font-weight: 600;
  }
  h2 .n { color: var(--faint); }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ── Interactive ────────────────────────────────────────────────── */
  button {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: var(--radius-sm); font: inherit; font-size: var(--text-base);
    padding: var(--sp-1) var(--sp-3); cursor: pointer;
    transition: border-color var(--ease);
  }
  button:hover { border-color: var(--dim); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, a:focus-visible, select:focus-visible,
  input:focus-visible, details summary:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 1px;
  }

  /* ── Ops strip (status page) ────────────────────────────────────── */
  #ops {
    display: flex; gap: var(--sp-4); align-items: flex-start; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius-md); padding: var(--sp-3); margin-top: var(--sp-3);
  }
  #windows { flex: 1; display: flex; flex-direction: column; gap: var(--sp-2); }
  .scv-win { min-width: 190px; }
  .scv-lab { display: flex; justify-content: space-between; font-size: var(--text-md); margin-bottom: 2px; }
  .scv-lab b { font-weight: 600; }
  .scv-bar { position: relative; height: 14px; background: #2a2a3a; border-radius: var(--radius-sm); overflow: hidden; }
  .scv-fill { display: inline-block; height: 100%; }
  .scv-fill.scv-ok { background: #4e8; }
  .scv-fill.scv-bad { background: #e54; }
  .scv-fill.scv-stale { background: #888; }
  .scv-soft { display: inline-block; height: 100%; background: repeating-linear-gradient(45deg, transparent, transparent 3px, rgba(255,255,255,0.15) 3px, rgba(255,255,255,0.15) 6px); }
  .scv-ramp { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff8; }
  .scv-sub { font-size: var(--text-sm); color: var(--dim); margin-top: 2px; }
  #opsRight { text-align: right; min-width: 220px; }
  #lastEvent { font-size: var(--text-sm); color: var(--dim); margin-top: var(--sp-2);
               max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── Cards ──────────────────────────────────────────────────────── */
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius-md); padding: var(--sp-2) var(--sp-3);
    margin-bottom: var(--sp-2);
  }
  .card .top { display: flex; gap: var(--sp-2); align-items: baseline; flex-wrap: wrap; }
  .badge {
    font-size: var(--text-xs); padding: 1px var(--sp-2); border-radius: var(--radius-sm);
    border: 1px solid var(--line); text-transform: uppercase; letter-spacing: .05em;
  }
  .sev-high, .sev-critical { color: var(--red); border-color: var(--red); }
  .sev-medium { color: var(--amber); border-color: var(--amber); }
  .sev-low { color: var(--dim); }
  .type-bug { background: #fee; color: #c33; border-color: #c33; }
  .type-dep_update { background: #eff; color: #36c; border-color: #36c; }
  .type-test_gap { background: #fef; color: #93c; border-color: #93c; }
  .type-refactor { background: #efe; color: #256029; border-color: #256029; }
  .type-modernization { background: #eef; color: #3b4b9c; border-color: #3b4b9c; }
  .status-merged { color: var(--green); border-color: var(--green); }
  .status-rejected, .status-wontfix { color: var(--faint); }
  .status-fixing, .status-rechecking { color: var(--blue); border-color: var(--blue); }
  .status-queued { color: var(--amber); border-color: var(--amber); }
  .status-pr_open { color: var(--purple); border-color: var(--purple); }
  .fp { font-size: var(--text-xs); color: var(--faint); }
  .card .sum { font-weight: 600; margin: var(--sp-1) 0; }
  .card .loc { font-size: var(--text-sm); color: var(--dim); }
  .card details { margin: var(--sp-2) 0 2px; }
  .card details summary { cursor: pointer; color: var(--dim); font-size: var(--text-sm); }
  .card pre {
    white-space: pre-wrap; background: var(--panel2); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: var(--sp-2); font-size: 11.5px;
    margin: var(--sp-2) 0; color: var(--fg);
  }
  .acts { display: flex; gap: var(--sp-2); margin-top: var(--sp-2); align-items: center; }
  .acts .q { border-color: var(--green); color: var(--green); }
  .acts .r { border-color: var(--red); color: var(--red); }
  .acts .rc { border-color: var(--purple); color: var(--purple); background: transparent; }
  .fd-section { margin: var(--sp-2) 0; }
  .fd-section b {
    font-size: var(--text-xs); color: var(--dim); text-transform: uppercase;
    letter-spacing: .05em; display: block; margin-bottom: var(--sp-1);
  }

  /* ── Pipeline ───────────────────────────────────────────────────── */
  #pipeline { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--sp-3); }
  .col {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius-md); padding: var(--sp-2);
  }
  .col h3 {
    margin: 0 0 var(--sp-2); font-size: var(--text-xs); text-transform: uppercase;
    letter-spacing: .1em; color: var(--dim); font-weight: 600;
  }
  .col .item { border-top: 1px solid var(--line); padding: var(--sp-1) 0; font-size: var(--text-base); }
  .col .item:first-of-type { border-top: none; }
  .col .item .m { color: var(--faint); font-size: var(--text-xs); display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
  .uq { font-size: var(--text-xs); padding: 1px var(--sp-2); border-color: var(--amber); color: var(--amber); background: transparent; }
  .ov { font-size: var(--text-2xs); padding: 1px var(--sp-1); border-radius: var(--radius-sm); background: var(--amber); color: #000; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .ov-btn { font-size: var(--text-xs); padding: 1px var(--sp-2); border-color: var(--blue); color: var(--blue); background: transparent; }
  .attn { font-size: var(--text-2xs); padding: 1px var(--sp-1); border-radius: var(--radius-sm); background: var(--red); color: #fff; font-weight: 600; }

  /* ── Repos ──────────────────────────────────────────────────────── */
  .repo-row {
    display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap;
    padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--line); font-size: var(--text-base);
  }
  .repo-row:last-child { border-bottom: none; }
  .repo-row .name { font-weight: 600; min-width: 100px; }
  .repo-row .url { color: var(--dim); font-size: var(--text-sm); word-break: break-all; flex: 1; min-width: 200px; }
  .repo-row .meta { color: var(--faint); font-size: var(--text-xs); }
  .repo-row .paused { color: var(--amber); font-weight: 600; }
  #repos { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-md); }

  /* ── Tables / feeds ─────────────────────────────────────────────── */
  table { width: 100%; border-collapse: collapse; font-size: var(--text-base); }
  th, td { text-align: left; padding: var(--sp-1) var(--sp-2); border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 600; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .08em; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.num { text-align: right; }
  .state-running { color: var(--blue); }
  .state-done { color: var(--green); }
  .state-killed, .state-failed { color: var(--red); }
  #events {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius-md); padding: var(--sp-2) var(--sp-3); font-size: 11.5px;
  }
  #events .ev { padding: 2px 0; color: var(--dim); }
  #events .ev .t { color: var(--faint); }
  #events .ev .k { color: var(--purple); }
  .ev-link { color: var(--blue); cursor: pointer; margin-left: var(--sp-1); }
  .ev-link:hover { text-decoration: underline; }
  .ev-job { color: var(--faint); margin-left: var(--sp-1); }
  .card.highlight { outline: 2px solid var(--blue); outline-offset: 2px; transition: outline-color 2s; }
  .empty { color: var(--faint); font-size: var(--text-base); padding: var(--sp-1) 0; }
  #err { color: var(--red); font-size: var(--text-sm); margin-top: var(--sp-2); display: none; }
  .timeline { font-size: var(--text-sm); border-left: 2px solid var(--line); margin: var(--sp-2) 0 2px var(--sp-1); padding-left: var(--sp-3); }
  .tl-entry { padding: 2px 0; color: var(--dim); }
  .tl-entry .t { color: var(--faint); margin-right: var(--sp-1); }
  .tl-entry .k { color: var(--purple); font-weight: 600; margin-right: 2px; }

  /* ── Filter bar ─────────────────────────────────────────────────── */
  .filters { margin-bottom: var(--sp-3); font-size: var(--text-base); }
  .filter-row { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }
  .filter-drop { position: relative; }
  .fd-toggle {
    display: flex; align-items: center; gap: var(--sp-1);
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: var(--radius-sm); font: inherit; font-size: var(--text-base);
    padding: var(--sp-1) var(--sp-2); cursor: pointer; white-space: nowrap;
    transition: border-color var(--ease);
  }
  .fd-toggle:hover { border-color: var(--dim); }
  .fd-label { color: var(--dim); font-size: var(--text-sm); }
  .fd-summary { color: var(--fg); }
  .fd-arrow { color: var(--dim); font-size: var(--text-xs); margin-left: 2px; }
  .fd-panel {
    display: none; position: absolute; top: 100%; left: 0; z-index: 100;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius-md); padding: var(--sp-2) var(--sp-3); margin-top: 2px;
    max-height: 240px; overflow-y: auto; min-width: 140px;
    box-shadow: var(--shadow-md);
  }
  .fd-panel.open { display: flex; flex-direction: column; gap: 2px; }
  .cb-item {
    display: flex; align-items: center; gap: var(--sp-1);
    color: var(--fg); font-size: var(--text-base); cursor: pointer;
    white-space: nowrap; padding: 2px 0;
  }
  .cb-item input[type=checkbox] { accent-color: var(--green); margin: 0; cursor: pointer; }
  .cb-all { color: var(--dim); border-bottom: 1px solid var(--line); padding-bottom: var(--sp-1); margin-bottom: 2px; }
  .filter-ctrl { display: flex; align-items: center; gap: var(--sp-1); }
  .filter-ctrl label { color: var(--dim); font-size: var(--text-sm); white-space: nowrap; }
  .filter-ctrl select, .filter-ctrl input[type=range] {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: var(--radius-sm); font: inherit; font-size: var(--text-base); padding: 2px var(--sp-2);
  }

  /* ── Dialog ─────────────────────────────────────────────────────── */
  dialog {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: var(--radius-lg); padding: var(--sp-4); min-width: 320px;
  }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  dialog h3 { margin: 0 0 var(--sp-3); font-size: var(--text-md); }
  .dlg-form { display: flex; flex-direction: column; gap: var(--sp-2); }
  .dlg-form label {
    display: flex; flex-direction: column; gap: var(--sp-1);
    font-size: var(--text-sm); color: var(--dim);
  }
  .dlg-form input, .dlg-form select {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: var(--radius-sm); font: inherit; font-size: var(--text-base);
    padding: var(--sp-1) var(--sp-2);
  }
  .dlg-actions { display: flex; gap: var(--sp-2); justify-content: flex-end; margin-top: var(--sp-4); }

  /* ── Toast ──────────────────────────────────────────────────────── */
  #toast {
    position: fixed; bottom: var(--sp-4); right: var(--sp-4); max-width: 360px; z-index: 100;
    display: flex; flex-direction: column; gap: var(--sp-2);
  }
  #toast .msg {
    background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--blue);
    border-radius: var(--radius-sm); padding: var(--sp-2) var(--sp-3); font-size: var(--text-base);
    box-shadow: var(--shadow-md); animation: toast-in var(--ease);
  }
  #toast .msg.err { border-left-color: var(--red); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } }

  /* ── Repo notes ─────────────────────────────────────────────────── */
  .repo-notes { flex-basis: 100%; margin-top: var(--sp-1); }
  .repo-notes summary {
    cursor: pointer; color: var(--dim); font-size: var(--text-sm); list-style: none;
  }
  .repo-notes summary::-webkit-details-marker { display: none; }
  .repo-notes summary::before { content: "\25b8  "; }
  .repo-notes[open] summary::before { content: "\25be  "; }
  .repo-notes-body { margin: var(--sp-2) 0 var(--sp-1) var(--sp-4); }
  .repo-notes-body pre {
    white-space: pre-wrap; background: var(--panel2); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: var(--sp-2) var(--sp-3); font-size: 11.5px;
    color: var(--fg); max-height: 240px; overflow-y: auto; margin: 0 0 var(--sp-2);
  }
  .rn-form { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: flex-start; }
  .rn-form input, .rn-form textarea {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: var(--radius-sm); font: inherit; font-size: var(--text-base);
    padding: var(--sp-1) var(--sp-2);
  }
  .rn-form textarea { flex: 1; min-width: 220px; resize: vertical; }

  /* ── Activity panel ─────────────────────────────────────────────── */
  #activity { margin: var(--sp-3) 0 var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-1); }
  #activity .row { font-size: var(--text-base); }
  #activity .dim { color: var(--dim); }
  #activity .running { color: var(--green); font-weight: 600; }
  #activity .ready { color: var(--blue); font-weight: 600; }
  #activity .paused { color: var(--amber); font-weight: 600; }
  #activity .error { color: var(--red); font-weight: 600; }
  #activity .idle { color: var(--dim); font-weight: 600; }
  #activity .last-log { color: var(--faint); font-size: var(--text-sm); margin-top: 2px; }
  #activity .b-denied { color: var(--red); }
  #activity .b-allowed { color: var(--green); }
  #activity .b-exempt { color: var(--blue); }
</style>
</head>
<body>
<div class="app">
  <nav id="nav">
    <div class="nav-logo">
      <svg viewBox="0 0 40 40" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- magnifying glass -->
        <circle cx="18" cy="18" r="11" stroke="#5aa0e0" stroke-width="2.2" opacity=".85"/>
        <line x1="26" y1="26" x2="36" y2="36" stroke="#5aa0e0" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
        <!-- bug body -->
        <ellipse cx="18" cy="19" rx="5" ry="6.5" fill="#4cbf6b" opacity=".9"/>
        <!-- head -->
        <circle cx="18" cy="11.5" r="2.8" fill="#4cbf6b" opacity=".9"/>
        <!-- legs -->
        <line x1="13" y1="15" x2="9"  y2="12" stroke="#4cbf6b" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="13" y1="19" x2="8"  y2="19" stroke="#4cbf6b" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="13" y1="23" x2="9"  y2="26" stroke="#4cbf6b" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="23" y1="15" x2="27" y2="12" stroke="#4cbf6b" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="23" y1="19" x2="28" y2="19" stroke="#4cbf6b" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="23" y1="23" x2="27" y2="26" stroke="#4cbf6b" stroke-width="1.4" stroke-linecap="round"/>
        <!-- wing line -->
        <line x1="18" y1="13" x2="18" y2="25" stroke="var(--panel)" stroke-width="1" opacity=".6"/>
        <!-- antennae -->
        <line x1="16" y1="9.5" x2="13" y2="6" stroke="#4cbf6b" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="20" y1="9.5" x2="23" y2="6" stroke="#4cbf6b" stroke-width="1.2" stroke-linecap="round"/>
        <circle cx="13" cy="5.5" r=".9" fill="#4cbf6b"/>
        <circle cx="23" cy="5.5" r=".9" fill="#4cbf6b"/>
      </svg>
      <span>hunter</span>
    </div>
    <button type="button" class="nav-item" data-page="status">Status</button>
    <button type="button" class="nav-item" data-page="inbox">Inbox</button>
    <button type="button" class="nav-item" data-page="pipeline">Kanban / Pipeline</button>
    <button type="button" class="nav-item" data-page="findings">All Findings</button>
    <button type="button" class="nav-item" data-page="repos">Repos</button>
    <button type="button" class="nav-item" data-page="stats">Stats</button>
    <button type="button" class="nav-item" data-page="log">Log</button>
  </nav>
  <main>
    <div id="err"></div>
    <div id="toast"></div>

    <section id="page-status" class="page">
      <h2>Status</h2>
      <div id="ops">
        <div id="windows"><span class="empty">no window data</span></div>
        <div id="opsRight">
          <button type="button" id="runCycle">Run Cycle</button>
          <div id="lastEvent">&nbsp;</div>
        </div>
      </div>
      <div id="activity"></div>
    </section>

    <section id="page-inbox" class="page">
      <h2>Inbox <span class="n" id="nInbox"></span></h2>
      <div id="filters-inbox" class="filters"></div>
      <div id="inbox"></div>
    </section>

    <section id="page-pipeline" class="page">
      <h2>Pipeline <button type="button" class="ov-btn" onclick="clearAllOverrides()" style="font-size:10px;vertical-align:middle">Clear all overrides</button></h2>
      <div id="filters-pipeline" class="filters"></div>
      <div id="pipeline"></div>

      <h2>Suppressed <span class="n" id="nSupp"></span></h2>
      <details><summary>rejected / wontfix</summary><div id="suppressed"></div></details>

      <h2>Notes <span class="n" id="nNotes"></span></h2>
      <details><summary>informational findings</summary><div id="notes"></div></details>
    </section>

    <section id="page-findings" class="page">
      <h2>All Findings <span class="n" id="nFindings"></span></h2>
      <div id="filters-findings" class="filters"></div>
      <div id="allFindings"></div>
    </section>

    <section id="page-repos" class="page">
      <h2>Repos <button type="button" class="ov-btn" onclick="document.getElementById('addRepoDialog').showModal()">+ Add Repo</button></h2>
      <div id="repos"></div>
    </section>

    <dialog id="addRepoDialog">
      <h3>Add Repo</h3>
      <div class="dlg-form">
        <label>name<input type="text" id="arName" placeholder="my-repo"></label>
        <label>url<input type="text" id="arUrl" placeholder="https://github.com/org/repo"></label>
        <label>branch<input type="text" id="arBranch" placeholder="main" value="main"></label>
        <label>forge<select id="arForge">
          <option value="">auto-detect</option>
          <option value="github">github</option>
          <option value="gitlab">gitlab</option>
        </select></label>
      </div>
      <div class="dlg-actions">
        <button type="button" class="q" onclick="addRepo()">Add</button>
        <button type="button" onclick="document.getElementById('addRepoDialog').close()">Cancel</button>
      </div>
    </dialog>

    <section id="page-stats" class="page">
      <h2>Stats</h2>
      <div id="stats"></div>
    </section>

    <section id="page-log" class="page">
      <h2>Jobs</h2>
      <div id="jobs"></div>

      <h2>Events</h2>
      <div id="events"></div>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Rust backend (hunter-rs/) ──────────────────────────────────
  rust:
    name: Rust — lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hunter-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: hunter-rs

      # Dev DB for sqlx compile-time checks
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Generate dev.db
        run: |
          cd ../hunter
          python3 -c "
          from pathlib import Path; import dataclasses
          from hunter.types import Config; from hunter.store import Store
          dev = Path('../hunter-rs/dev.db').resolve(); dev.unlink(missing_ok=True)
          Store(dataclasses.replace(Config.load(), db_path=dev))
          print('dev.db regenerated')
          "

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: SQL encapsulation
        run: |
          echo "Checking pool() encapsulation..."
          if grep -rn '\.pool()' src/ | grep -v 'store\.rs' | grep -v '//'; then
            echo "✗ pool() leaked outside store.rs"
            exit 1
          fi
          echo "✓ pool() only in store.rs"

          echo "Checking compile-time checked queries..."
          if grep -rn 'sqlx::query(' src/ | grep -v 'query!\|query_as!\|query_scalar!\|capacity\.rs\|//'; then
            echo "✗ unchecked sqlx::query found"
            exit 1
          fi
          echo "✓ all queries compile-time checked"

          echo "Checking no QueryBuilder..."
          if grep -rn 'QueryBuilder' src/ | grep -v '//'; then
            echo "✗ QueryBuilder found"
            exit 1
          fi
          echo "✓ no QueryBuilder"

      - name: Test
        run: cargo test

  # ── Svelte frontend (hunter/ui-svelte/) ────────────────────────
  frontend:
    name: Frontend — lint + typecheck + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hunter/ui-svelte
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hunter/ui-svelte/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npx eslint src/

      - name: Svelte check
        run: npx svelte-check --tsconfig tsconfig.app.json

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx vite build
  # ── Python hunter (hunter/) ────────────────────────────────────
  python:
    name: Python — lint + typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hunter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install deps
        run: pip install ruff mypy pydantic pytest

      - name: Format check
        run: ruff format --check hunter/ tests/

      - name: Lint
        run: ruff check hunter/ tests/

      - name: Typecheck
        run: mypy --strict hunter/

      - name: Test
        run: pytest tests/ -q

